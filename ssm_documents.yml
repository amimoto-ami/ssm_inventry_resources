---
AWSTemplateFormatVersion: '2010-09-09'
Description: |
  SSM sample
Resources:
  CustomApplications:
    Type: "AWS::SSM::Document"
    Properties:
      DocumentType: "Command"
      Content:
        schemaVersion: "1.2"
        description: "Additional Packages"
        runtimeConfig:
          aws:runShellScript:
            properties:
              - id: 0.aws:runShellScript
                runCommand:
                  - TOKEN=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds:21600") || { echo "ERROR failed to get IMDSv2 token" >&2; exit 1; }
                  - REGION=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/placement/region") || { echo "ERROR failed to get region from IMDS" >&2; exit 1; }
                  - INSTANCEID=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/instance-id") || { echo "ERROR failed to get instance-id from IMDS" >&2; exit 1; }
                  - if [ -z "${REGION}" ] || [ -z "${INSTANCEID}" ]; then echo "ERROR REGION or INSTANCEID is empty" >&2; exit 1; fi
                  - ITEMS=$(curl https://raw.githubusercontent.com/amimoto-ami/ssm_inventry_resources/master/packages.sh | bash)
                  - aws ssm put-inventory  --instance-id "${INSTANCEID}"  --items "$(echo ${ITEMS})"  --region "${REGION}"
                workingDirectory: "/"
                timeoutSeconds: "300"
  GetAllWpVersion:
    Type: "AWS::SSM::Document"
    Properties:
      DocumentType: "Command"
      Content:
        schemaVersion: "1.2"
        description: "List Installed WordPress Versions"
        runtimeConfig:
          aws:runShellScript:
            properties:
              - id: 0.aws:runShellScript
                runCommand:
                  - TOKEN=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds:21600") || { echo "ERROR failed to get IMDSv2 token" >&2; exit 1; }
                  - REGION=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/placement/region") || { echo "ERROR failed to get region from IMDS" >&2; exit 1; }
                  - INSTANCEID=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/instance-id") || { echo "ERROR failed to get instance-id from IMDS" >&2; exit 1; }
                  - if [ -z "${REGION}" ] || [ -z "${INSTANCEID}" ]; then echo "ERROR REGION or INSTANCEID is empty" >&2; exit 1; fi
                  - ITEMS=$(curl https://raw.githubusercontent.com/amimoto-ami/ssm_inventry_resources/master/wordpress_versions.sh | bash)
                  - aws ssm put-inventory  --instance-id "${INSTANCEID}"  --items "$(echo ${ITEMS})"  --region "${REGION}"
                workingDirectory: "/var/www/vhosts/"
                timeoutSeconds: "300"
  ListNginxDomains:
    Type: "AWS::SSM::Document"
    Properties:
      DocumentType: "Command"
      Content:
        schemaVersion: "1.2"
        description: "List nginx defined domain lists"
        runtimeConfig:
          aws:runShellScript:
            properties:
              - id: 0.aws:runShellScript
                runCommand:
                  - TOKEN=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds:21600") || { echo "ERROR failed to get IMDSv2 token" >&2; exit 1; }
                  - REGION=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/placement/region") || { echo "ERROR failed to get region from IMDS" >&2; exit 1; }
                  - INSTANCEID=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/instance-id") || { echo "ERROR failed to get instance-id from IMDS" >&2; exit 1; }
                  - if [ -z "${REGION}" ] || [ -z "${INSTANCEID}" ]; then echo "ERROR REGION or INSTANCEID is empty" >&2; exit 1; fi
                  - ITEMS=$(curl https://raw.githubusercontent.com/amimoto-ami/ssm_inventry_resources/master/nginx_ssl_domains.sh | bash)
                  - aws ssm put-inventory  --instance-id "${INSTANCEID}"  --items "$(echo ${ITEMS})"  --region "${REGION}"
                workingDirectory: "/etc/nginx/conf.d/"
                timeoutSeconds: "300"
  WordPressDiskUsageAmount:
    Type: "AWS::SSM::Document"
    Properties:
      DocumentType: "Command"
      Content:
        schemaVersion: "1.2"
        description: "Get WordPress disk usage amount"
        runtimeConfig:
          aws:runShellScript:
            properties:
              - id: 0.aws:runShellScript
                runCommand:
                  - TOKEN=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds:21600") || { echo "ERROR failed to get IMDSv2 token" >&2; exit 1; }
                  - REGION=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/placement/region") || { echo "ERROR failed to get region from IMDS" >&2; exit 1; }
                  - INSTANCEID=$(curl -sS --fail --retry 2 --connect-timeout 2 --max-time 5 -H "X-aws-ec2-metadata-token:${TOKEN}" "http://169.254.169.254/latest/meta-data/instance-id") || { echo "ERROR failed to get instance-id from IMDS" >&2; exit 1; }
                  - if [ -z "${REGION}" ] || [ -z "${INSTANCEID}" ]; then echo "ERROR REGION or INSTANCEID is empty" >&2; exit 1; fi
                  - ITEMS=$(curl https://raw.githubusercontent.com/amimoto-ami/ssm_inventry_resources/master/wordpress_disk_usage_amount.sh | bash)
                  - aws ssm put-inventory  --instance-id "${INSTANCEID}"  --items "$(echo ${ITEMS})"  --region "${REGION}"
                workingDirectory: "/var/www/vhosts/"
                timeoutSeconds: "300"
